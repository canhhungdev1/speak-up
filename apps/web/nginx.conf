server {
    listen 80;
    server_name localhost;

    # Thư mục chứa mã nguồn tĩnh của Angular sau khi build
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. Bật nén Gzip giúp tải web nhanh gấp 3 lần
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # --------------------------------------------------------------------------
    # 2. Reverse Proxy cho API: Chuyển tiếp /api/* về NestJS Backend (http://api:3000)
    #    -> Triệt tiêu hoàn toàn lỗi CORS và che giấu cổng backend
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cấu hình
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 3. Cache tối ưu cho các file tĩnh (JS, CSS, hình ảnh, Audio)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|mp3|wav)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 4. Angular SPA Routing Fallback
    #    Nếu đường dẫn không khớp file nào, fallback về index.html để Angular Router xử lý
    #    -> Chống lỗi 404 khi bấm F5 reload trang
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
