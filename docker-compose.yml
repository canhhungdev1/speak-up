services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: speakup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-speakup_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - speakup-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-speakup_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis In-Memory Data Store (Cache & Rate Limiting)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: speakup-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-speakup_redis_secret}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - speakup-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-speakup_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. RabbitMQ Message Broker (với Web Management Dashboard)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: speakup-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin123}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"               # AMQP protocol port
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # Web Management Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - speakup-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

# ------------------------------------------------------------------------------
# Persistent Volumes & Network Definitions
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: speakup_postgres_data
  redis_data:
    name: speakup_redis_data
  rabbitmq_data:
    name: speakup_rabbitmq_data

networks:
  speakup-network:
    name: speakup-network
    driver: bridge
